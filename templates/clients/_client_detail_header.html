<!-- =============================================================
     CABEÇALHO DO CLIENTE
============================================================== -->

<section
    class="relative overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-sm"
    aria-labelledby="client-detail-title"
>

    <!-- =========================================================
         DETALHE VISUAL
    ========================================================== -->

    <div
        class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-brand-900 via-brand-700 to-gold-400"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         CONTEÚDO
    ========================================================== -->

    <div class="p-5 pt-6 sm:p-6 sm:pt-7 lg:p-7">

        <div
            class="flex flex-col justify-between gap-6 xl:flex-row xl:items-center"
        >

            <!-- =================================================
                 IDENTIFICAÇÃO DO CLIENTE
            ================================================== -->

            <div class="flex min-w-0 items-center gap-4 sm:gap-5">

                <!-- =============================================
                     AVATAR
                ============================================== -->

                <div
                    class="relative flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-brand-900 text-lg font-semibold uppercase text-white shadow-sm ring-4 ring-brand-50 sm:h-16 sm:w-16 sm:text-xl"
                    aria-hidden="true"
                >
                    {{ client.nome_completo|slice:":1"|upper }}

                    <span
                        class="absolute -bottom-1 -right-1 h-3.5 w-3.5 rounded-full border-[3px] border-white bg-gold-400"
                    ></span>
                </div>


                <!-- =============================================
                     NOME E METADADOS
                ============================================== -->

                <div class="min-w-0">

                    <div class="flex flex-wrap items-center gap-2">

                        <span
                            class="inline-flex items-center gap-1.5 rounded-full border border-gold-200 bg-gold-50 px-2.5 py-1 text-xs font-semibold text-gold-700"
                        >
                            <span
                                class="h-1.5 w-1.5 rounded-full bg-gold-500"
                                aria-hidden="true"
                            ></span>

                            Cliente
                        </span>


                        <span
                            class="text-xs font-medium text-slate-400"
                        >
                            ID #{{ client.pk }}
                        </span>

                    </div>


                    <h1
                        id="client-detail-title"
                        class="mt-2 truncate text-2xl font-semibold tracking-tight text-brand-950 sm:text-3xl"
                        title="{{ client.nome_completo }}"
                    >
                        {{ client.nome_completo }}
                    </h1>


                    <div
                        class="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1.5 text-sm text-slate-500"
                    >

                        <!-- CPF -->

                        <span
                            class="inline-flex items-center gap-1.5"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.7"
                                stroke="currentColor"
                                class="h-4 w-4 shrink-0 text-brand-400"
                                aria-hidden="true"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 9h3.75M15 12h3.75M15 15h3.75M4.5 19.5h15a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5h-15A1.5 1.5 0 0 0 3 6v12a1.5 1.5 0 0 0 1.5 1.5Z"
                                />

                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M9 9.75a1.875 1.875 0 1 0 0-3.75 1.875 1.875 0 0 0 0 3.75Zm3 5.625a3 3 0 0 0-6 0"
                                />
                            </svg>

                            <span>
                                CPF

                                <strong
                                    class="font-medium text-slate-700"
                                >
                                    {{ client.cpf_formatado }}
                                </strong>
                            </span>
                        </span>


                        <!-- SEPARADOR -->

                        <span
                            class="hidden h-4 w-px bg-brand-100 sm:block"
                            aria-hidden="true"
                        ></span>


                        <!-- CLIENTE DESDE -->

                        <span
                            class="inline-flex items-center gap-1.5"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke-width="1.7"
                                stroke="currentColor"
                                class="h-4 w-4 shrink-0 text-brand-400"
                                aria-hidden="true"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M6.75 3v2.25M17.25 3v2.25M3.75 9.75h16.5m-15 11.25h13.5A1.5 1.5 0 0 0 20.25 19.5V6.75a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5V19.5A1.5 1.5 0 0 0 5.25 21Z"
                                />
                            </svg>

                            <span>
                                Cliente desde

                                <strong
                                    class="font-medium text-slate-700"
                                >
                                    {{ client.criado_em|date:"d/m/Y" }}
                                </strong>
                            </span>
                        </span>

                    </div>

                </div>

            </div>


            <!-- =================================================
                 AÇÕES
            ================================================== -->

            <div
                class="flex shrink-0 flex-col gap-2.5 sm:flex-row sm:flex-wrap sm:items-center"
            >

                <!-- =============================================
                     GERAR DOSSIÊ
                ============================================== -->

                <button
                    type="button"
                    id="open-dossier-modal"
                    class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-xl border border-brand-200 bg-white px-4 text-sm font-semibold leading-none text-brand-800 shadow-sm transition hover:border-brand-300 hover:bg-brand-50 hover:text-brand-950 focus:outline-none focus:ring-4 focus:ring-brand-100"
                >
                    <!-- ÍCONE DE DOCUMENTO / DOSSIÊ -->

                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-[18px] w-[18px] shrink-0"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M19.5 14.25v-2.625A3.375 3.375 0 0 0 16.125 8.25h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5A3.375 3.375 0 0 0 10.125 2.25H6.75A2.25 2.25 0 0 0 4.5 4.5v15A2.25 2.25 0 0 0 6.75 21.75h10.5A2.25 2.25 0 0 0 19.5 19.5v-5.25Z"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M8.25 13.5h7.5M8.25 16.5h7.5M8.25 10.5H12"
                        />
                    </svg>

                    <span class="leading-none">
                        Gerar Dossiê
                    </span>
                </button>


                <!-- =============================================
                     EDITAR CLIENTE
                ============================================== -->

                <button
                    type="button"
                    id="open-edit-client-modal"
                    class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-xl border border-gold-200 bg-gold-50 px-4 text-sm font-semibold leading-none text-gold-800 shadow-sm transition hover:border-gold-300 hover:bg-gold-100 hover:text-gold-900 focus:outline-none focus:ring-4 focus:ring-gold-100"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-[18px] w-[18px] shrink-0"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13l-2.507.716.716-2.507a4.5 4.5 0 0 1 1.13-1.897L16.862 4.487Z"
                        />

                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M19.5 7.125 16.875 4.5"
                        />
                    </svg>

                    <span class="leading-none">
                        Editar
                    </span>
                </button>


                <!-- =============================================
                     NOVA CAUSA
                ============================================== -->

                <a
                    href="{% url 'cases:create' client.pk %}"
                    data-case-modal-open
                    data-case-url="{% url 'cases:create' client.pk %}"
                    class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 whitespace-nowrap rounded-xl bg-brand-900 px-5 text-sm font-semibold leading-none text-white shadow-sm transition hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-200"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="2"
                        stroke="currentColor"
                        class="h-[18px] w-[18px] shrink-0"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M12 4.5v15m7.5-7.5h-15"
                        />
                    </svg>

                    <span class="leading-none">
                        Nova Causa
                    </span>
                </a>

            </div>

        </div>

    </div>

</section>
