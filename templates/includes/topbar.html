<header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur">

    <div class="flex h-20 items-center justify-between px-8 lg:px-10">

        <div>
            <p class="text-xs font-medium uppercase tracking-[0.18em] text-slate-400">
                Escritório Jurídico
            </p>

            <h2 class="mt-1 text-lg font-semibold tracking-tight text-slate-900">
                {% block page_header %}
                    Gestão Jurídica
                {% endblock %}
            </h2>
        </div>


        <div class="flex items-center gap-3">

            <button
                type="button"
                class="flex h-10 w-10 items-center justify-center rounded-xl border border-slate-200 bg-white text-slate-500 transition hover:bg-slate-50 hover:text-slate-900"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.7"
                    stroke="currentColor"
                    class="h-5 w-5"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M14.857 17.082a23.85 23.85 0 0 0 5.454-1.31A8.97 8.97 0 0 1 18 9.75v-.7V9a6 6 0 1 0-12 0v.05-.05.75a8.97 8.97 0 0 1-2.31 6.022 23.85 23.85 0 0 0 5.454 1.31m5.714 0a24.25 24.25 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"
                    />
                </svg>
            </button>

        </div>

    </div>

</header>
