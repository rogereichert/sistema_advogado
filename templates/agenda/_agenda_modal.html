<!-- =============================================================
     MODAL — NOVO COMPROMISSO
============================================================== -->

<div
    id="agenda-modal"
    class="fixed inset-0 z-50 hidden"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="agenda-modal-title"
>

    <!-- =========================================================
         BACKDROP
    ========================================================== -->

    <div
        data-agenda-modal-backdrop
        class="absolute inset-0 bg-brand-950/45 backdrop-blur-[1px]"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         CONTAINER
    ========================================================== -->

    <div
        class="relative flex min-h-full items-center justify-center p-4 sm:p-6"
    >

        <!-- =====================================================
             PAINEL
        ====================================================== -->

        <div
            data-agenda-modal-panel
            class="relative w-full max-w-3xl overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-2xl"
        >

            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <header
                class="flex items-start justify-between gap-5 border-b border-brand-100 px-5 py-5 sm:px-6"
            >

                <div class="flex min-w-0 items-start gap-3">

                    <!-- ÍCONE -->

                    <div
                        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand-950 text-white shadow-sm"
                        aria-hidden="true"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                            stroke="currentColor"
                            class="h-5 w-5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M6.75 3v2.25M17.25 3v2.25M3.75 8.25h16.5m-15 12h13.5A1.5 1.5 0 0 0 20.25 18.75V6.75a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v12a1.5 1.5 0 0 0 1.5 1.5Z"
                            />

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 11.25v6m3-3H9"
                            />
                        </svg>
                    </div>


                    <!-- TÍTULO -->

                    <div class="min-w-0">

                        <p
                            class="text-[10px] font-semibold uppercase tracking-[0.14em] text-gold-700"
                        >
                            Agenda
                        </p>

                        <h2
                            id="agenda-modal-title"
                            class="mt-0.5 text-lg font-semibold tracking-tight text-brand-950"
                        >
                            Novo compromisso
                        </h2>

                        <p
                            class="mt-1 text-sm leading-5 text-slate-500"
                        >
                            Registre audiências, prazos, reuniões e
                            outros eventos vinculados ao caso.
                        </p>

                    </div>

                </div>


                <!-- FECHAR -->

                <button
                    type="button"
                    data-agenda-modal-close
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-brand-950 focus:outline-none focus:ring-4 focus:ring-brand-100"
                    aria-label="Fechar modal"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-5 w-5"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18 18 6M6 6l12 12"
                        />
                    </svg>
                </button>

            </header>


            <!-- =================================================
                 CONTEÚDO DINÂMICO
            ================================================== -->

            <div
                id="agenda-modal-body"
                class="max-h-[calc(100vh-11rem)] overflow-y-auto px-5 py-6 sm:px-6"
            >

                <!--
                    O formulário será carregado aqui via AJAX.

                    Template:
                    agenda/_agenda_form_content.html
                -->

                <div
                    data-agenda-modal-loading
                    class="flex min-h-64 items-center justify-center"
                >

                    <div class="text-center">

                        <svg
                            class="mx-auto h-6 w-6 animate-spin text-brand-700"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>

                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"
                            ></path>
                        </svg>

                        <p
                            class="mt-3 text-sm font-medium text-slate-500"
                        >
                            Carregando compromisso...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
