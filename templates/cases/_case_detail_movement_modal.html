<!-- =============================================================
     MODAL — NOVA MOVIMENTAÇÃO
============================================================== -->

<div
    id="movement-modal"
    class="fixed inset-0 z-[100] hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="movement-modal-title"
    aria-hidden="true"
>

    <!-- =========================================================
         BACKDROP
    ========================================================== -->

    <div
        data-movement-modal-backdrop
        class="absolute inset-0 bg-brand-950/55 backdrop-blur-[2px]"
    ></div>


    <!-- =========================================================
         POSICIONAMENTO
    ========================================================== -->

    <div
        class="relative flex min-h-full items-center justify-center p-4 sm:p-6"
    >

        <!-- =====================================================
             PAINEL
        ====================================================== -->

        <div
            data-movement-modal-panel
            class="relative flex max-h-[calc(100vh-2rem)] w-full max-w-2xl flex-col overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-2xl sm:max-h-[calc(100vh-3rem)]"
        >

            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <header
                class="flex shrink-0 items-start justify-between gap-4 border-b border-brand-100 bg-white px-5 py-5 sm:px-6"
            >

                <div class="flex min-w-0 items-start gap-3">

                    <div
                        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand-950 text-white shadow-sm"
                        aria-hidden="true"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                            stroke="currentColor"
                            class="h-5 w-5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"
                            />
                        </svg>
                    </div>


                    <div class="min-w-0">

                        <p
                            class="text-[10px] font-semibold uppercase tracking-[0.14em] text-gold-700"
                        >
                            Histórico jurídico
                        </p>

                        <h2
                            id="movement-modal-title"
                            class="mt-0.5 text-lg font-semibold tracking-tight text-brand-950"
                        >
                            Nova movimentação
                        </h2>

                        <p
                            class="mt-1 text-xs leading-5 text-slate-500 sm:text-sm"
                        >
                            Registre uma atualização no histórico deste caso.
                        </p>

                    </div>

                </div>


                <!-- FECHAR -->

                <button
                    type="button"
                    data-movement-modal-close
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-brand-950 focus:outline-none focus:ring-4 focus:ring-brand-100"
                    aria-label="Fechar modal"
                    title="Fechar"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-5 w-5"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18 18 6M6 6l12 12"
                        />
                    </svg>
                </button>

            </header>


            <!-- =================================================
                 CONTEÚDO DINÂMICO
            ================================================== -->

            <div
                id="movement-modal-body"
                class="min-h-0 flex-1 overflow-y-auto px-5 py-5 sm:px-6 sm:py-6"
            >

                <!-- =============================================
                     ESTADO INICIAL / CARREGAMENTO
                ============================================== -->

                <div
                    data-movement-modal-loading
                    class="flex min-h-64 items-center justify-center"
                >

                    <div class="text-center">

                        <svg
                            class="mx-auto h-6 w-6 animate-spin text-brand-700"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>

                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"
                            ></path>
                        </svg>


                        <p
                            class="mt-3 text-sm font-medium text-slate-500"
                        >
                            Carregando formulário...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
