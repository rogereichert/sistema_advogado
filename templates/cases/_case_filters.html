<form
    method="get"
    action="{% url 'cases:list' %}"
    id="case-filter-form"
    class="rounded-2xl border border-brand-100 bg-white p-4 shadow-sm"
>

    <div
        class="flex flex-col gap-4 xl:flex-row xl:items-center"
    >

        <!-- =====================================================
             BUSCA
        ====================================================== -->

        <div class="relative w-full xl:flex-1">

            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-brand-500"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="m21 21-4.35-4.35m1.35-5.4a6.75 6.75 0 1 1-13.5 0 6.75 6.75 0 0 1 13.5 0Z"
                />
            </svg>


            <label
                for="case-search"
                class="sr-only"
            >
                Buscar casos
            </label>


            <input
                type="search"
                id="case-search"
                name="q"
                value="{{ search }}"
                autocomplete="off"
                placeholder="Buscar por cliente, CPF, título ou número do processo..."
                class="w-full rounded-xl border border-brand-100 bg-app-soft py-2.5 pl-10 pr-10 text-sm text-brand-950 outline-none transition placeholder:text-slate-400 hover:border-brand-200 focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100"
            >


            {% if search %}

                <a
                    href="?{% if selected_status %}status={{ selected_status }}{% endif %}"
                    class="absolute right-2 top-1/2 flex h-8 w-8 -translate-y-1/2 items-center justify-center rounded-lg text-slate-400 transition hover:bg-brand-50 hover:text-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-100"
                    title="Limpar pesquisa"
                    aria-label="Limpar pesquisa"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-4 w-4"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18 18 6M6 6l12 12"
                        />
                    </svg>
                </a>

            {% endif %}

        </div>


        <!-- =====================================================
             STATUS
        ====================================================== -->

        <div class="w-full xl:w-64">

            <label
                for="case-status"
                class="sr-only"
            >
                Status
            </label>


            <select
                id="case-status"
                name="status"
                class="w-full cursor-pointer rounded-xl border border-brand-100 bg-app-soft px-3.5 py-2.5 text-sm text-brand-950 outline-none transition hover:border-brand-200 focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100"
            >

                <option value="">
                    Todos os status
                </option>

                {% for status in statuses %}

                    <option
                        value="{{ status.pk }}"
                        {% if selected_status == status.pk|stringformat:"s" %}
                            selected
                        {% endif %}
                    >
                        {{ status.nome }}
                    </option>

                {% endfor %}

            </select>

        </div>


        <!-- =====================================================
             APLICAR FILTROS
        ====================================================== -->

        <button
            type="submit"
            class="inline-flex min-h-11 w-full shrink-0 items-center justify-center gap-2 rounded-xl bg-brand-900 px-5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-200 xl:w-auto"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.8"
                stroke="currentColor"
                class="h-4 w-4"
                aria-hidden="true"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.012L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z"
                />
            </svg>

            <span data-submit-label>
                Aplicar filtros
            </span>

        </button>


        <!-- =====================================================
             CONTADOR
        ====================================================== -->

        <div
            class="flex min-h-11 shrink-0 items-center justify-center gap-2.5 rounded-xl bg-brand-50 px-3.5 py-2 text-sm text-brand-700 xl:ml-1"
            aria-live="polite"
        >

            <span
                class="relative flex h-2.5 w-2.5"
                aria-hidden="true"
            >
                <span
                    class="absolute inline-flex h-full w-full rounded-full bg-brand-300 opacity-50"
                ></span>

                <span
                    class="relative inline-flex h-2.5 w-2.5 rounded-full bg-brand-600"
                ></span>
            </span>


            <span class="whitespace-nowrap">

                <strong
                    id="case-result-count"
                    class="font-semibold text-brand-950"
                >
                    {{ total_cases }}
                </strong>

                {% if total_cases == 1 %}
                    caso
                {% else %}
                    casos
                {% endif %}

            </span>

        </div>

    </div>


    <!-- =========================================================
         LIMPAR FILTROS
    ========================================================== -->

    {% if search or selected_status %}

        <div class="mt-3 flex justify-end">

            <a
                href="{% url 'cases:list' %}"
                class="inline-flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-xs font-medium text-slate-500 transition hover:bg-brand-50 hover:text-brand-800 focus:outline-none focus:ring-4 focus:ring-brand-100"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.8"
                    stroke="currentColor"
                    class="h-3.5 w-3.5"
                    aria-hidden="true"
                >
                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M6 18 18 6M6 6l12 12"
                    />
                </svg>

                Limpar filtros
            </a>

        </div>

    {% endif %}

</form>
