<!-- =============================================================
     MODAL — CASO JURÍDICO
     Reutilizado para criação e edição
============================================================== -->

<div
    id="case-modal"
    class="fixed inset-0 z-50 hidden"
    aria-hidden="true"
    role="dialog"
    aria-modal="true"
    aria-labelledby="case-modal-title"
>

    <!-- =========================================================
         BACKDROP
    ========================================================== -->

    <div
        data-case-modal-backdrop
        class="absolute inset-0 bg-brand-950/45 backdrop-blur-[1px]"
        aria-hidden="true"
    ></div>


    <!-- =========================================================
         CONTAINER
    ========================================================== -->

    <div
        class="relative flex min-h-full items-center justify-center p-4 sm:p-6"
    >

        <!-- =====================================================
             PAINEL
        ====================================================== -->

        <div
            data-case-modal-panel
            class="relative w-full max-w-4xl overflow-hidden rounded-2xl border border-brand-100 bg-white shadow-2xl"
        >

            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <header
                class="flex items-start justify-between gap-5 border-b border-brand-100 px-5 py-5 sm:px-6"
            >

                <div class="flex min-w-0 items-start gap-3">

                    <!-- ÍCONE -->

                    <div
                        class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-brand-950 text-white shadow-sm"
                        aria-hidden="true"
                    >

                        <!-- ÍCONE — EDITAR -->

                        <svg
                            data-case-modal-icon-edit
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                            stroke="currentColor"
                            class="h-5 w-5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L10.582 16.07a4.5 4.5 0 0 1-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 0 1 1.13-1.897l8.932-8.931"
                            />

                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M19.5 7.125V18.75A2.25 2.25 0 0 1 17.25 21H5.25A2.25 2.25 0 0 1 3 18.75V6.75A2.25 2.25 0 0 1 5.25 4.5h11.625"
                            />
                        </svg>


                        <!-- ÍCONE — CRIAR -->

                        <svg
                            data-case-modal-icon-create
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.8"
                            stroke="currentColor"
                            class="hidden h-5 w-5"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M12 4.5v15m7.5-7.5h-15"
                            />
                        </svg>

                    </div>


                    <!-- TÍTULO -->

                    <div class="min-w-0">

                        <p
                            class="text-[10px] font-semibold uppercase tracking-[0.14em] text-gold-700"
                        >
                            Caso jurídico
                        </p>

                        <h2
                            id="case-modal-title"
                            data-case-modal-title
                            class="mt-0.5 text-lg font-semibold tracking-tight text-brand-950"
                        >
                            Caso jurídico
                        </h2>

                        <p
                            data-case-modal-description
                            class="mt-1 text-sm leading-5 text-slate-500"
                        >
                            Gerencie as informações jurídicas do caso.
                        </p>

                    </div>

                </div>


                <!-- FECHAR -->

                <button
                    type="button"
                    data-case-modal-close
                    class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-400 transition hover:bg-slate-100 hover:text-brand-950 focus:outline-none focus:ring-4 focus:ring-brand-100"
                    aria-label="Fechar modal"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        fill="none"
                        viewBox="0 0 24 24"
                        stroke-width="1.8"
                        stroke="currentColor"
                        class="h-5 w-5"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M6 18 18 6M6 6l12 12"
                        />
                    </svg>
                </button>

            </header>


            <!-- =================================================
                 CONTEÚDO DINÂMICO
            ================================================== -->

            <div
                id="case-modal-body"
                class="max-h-[calc(100vh-11rem)] overflow-y-auto px-5 py-6 sm:px-6"
            >

                <!--
                    O formulário será carregado aqui via AJAX.

                    Template:
                    cases/_case_form_content.html
                -->

                <div
                    data-case-modal-loading
                    class="flex min-h-72 items-center justify-center"
                >

                    <div class="text-center">

                        <svg
                            class="mx-auto h-6 w-6 animate-spin text-brand-700"
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                class="opacity-25"
                                cx="12"
                                cy="12"
                                r="10"
                                stroke="currentColor"
                                stroke-width="4"
                            ></circle>

                            <path
                                class="opacity-75"
                                fill="currentColor"
                                d="M4 12a8 8 0 0 1 8-8V0C5.373 0 0 5.373 0 12h4Z"
                            ></path>
                        </svg>

                        <p
                            class="mt-3 text-sm font-medium text-slate-500"
                        >
                            Carregando formulário...
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>
